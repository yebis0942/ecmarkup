      <div style="flex: 1; background: #ffffff; border: 2px solid #fc7c00; padding: 14px 18px;"><strong style="color: #6e130b;">解:</strong> <span style="font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;">git merge-base &lt;tag&gt; main</span><br><span style="color: #6b5f54; font-size: 17px;">「リリースブランチが main から分岐した点」を各版の代表ハッシュにする。</span></div>
